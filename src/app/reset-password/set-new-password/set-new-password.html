<div class="auth-form-wrapper">
  <mat-card class="auth-form">
    <mat-card-header>
      <mat-card-title>
        <h3 i18n>새 비밀번호 설정</h3>
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        id="change-password-form"
      >
        <gt-form-error [errors]="formErrors()"></gt-form-error>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label i18n>새 비밀번호</mat-label>
          <input
            matInput
            autofocus
            type="password"
            formControlName="password"
          />
          <mat-error>
            @if (password?.errors?.minlength) {
            <span i18n>비밀번호는 8자 이상이어야 합니다</span>
            } @if (password?.errors?.required) {
            <span i18n>새 비밀번호를 입력하세요</span>
            }
          </mat-error>
        </mat-form-field>
        <mat-form-field class="full-width" appearance="outline">
          <mat-label i18n>새 비밀번호 확인</mat-label>
          <input
            matInput
            type="password"
            formControlName="password2"
            gtInputMatcher="password"
          />

          <mat-error>
            @if (password2?.errors?.required) {
            <span i18n>새 비밀번호를 입력하세요</span>
            } @if (password2?.errors?.notEqual) {
            <span i18n>비밀번호가 일치하지 않습니다</span>
            }
          </mat-error>
        </mat-form-field>
        <gt-loading-button
          class="full-width"
          i18n-buttonText
          buttonText="Change Password"
          [loading]="loading()"
          [fullWidth]="true"
        ></gt-loading-button>
      </form>
      <div class="sign-up">
        <p class="body-text">
          <a routerLink="/login" i18n>로그인</a>
        </p>
        <p class="body-text">
          <a routerLink="/register" i18n>Register</a>
        </p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
