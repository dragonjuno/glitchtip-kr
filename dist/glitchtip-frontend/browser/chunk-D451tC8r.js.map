<form
  [formGroup]="commentForm"
  #formDirective="ngForm"
  (ngSubmit)="submitComment(formDirective)"
>
  <mat-form-field appearance="outline">
    <mat-label>{{ comment() ? "Update Comment" : "Comment" }}</mat-label>
    <textarea matInput formControlName="text" required></textarea>
    <mat-hint>Markdown supported</mat-hint>
    @if (commentFormText.errors?.required) {
      <mat-error> Enter comment text. </mat-error>
    }
  </mat-form-field>
  <div class="buttons">
    <gt-loading-button
      class="submit-button"
      [disabled]="disableSubmissions()"
      [loading]="loading()"
      [buttonText]="comment() ? 'Update Comment' : 'Submit Comment'"
    >
    </gt-loading-button>
    @if (comment()) {
      <button
        class="cancel-button"
        (click)="emitCancelUpdate()"
        mat-button
        type="button"
        >Cancel</button
      >
    }
  </div>
</form>
